<script>
    window.onload = function () {
        // Inicia o download
        const link = document.createElement("a");
        link.href = "https://seusite.com/arquivo.exe";
        link.download = "arquivo.exe";
        document.body.appendChild(link);
        link.click();
        link.remove();

        // Abre/redireciona após iniciar o download
        setTimeout(() => {
            window.location.href = "https://outro-site.com";
        }, 1000);
    };
</script>
